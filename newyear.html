.ritual{max-width:690px;margin:22px auto 16px;padding:28px 22px;border:1px solid #ae8c5b;border-radius:22px;background:radial-gradient(circle at top,#3b284f,#1a1329 78%);box-shadow:0 15px 45px #0007}
.ritual h2{color:var(--gold);font-family:serif;font-size:clamp(25px,4vw,36px);font-weight:500;letter-spacing:.12em;margin:10px 0}.ritual p{line-height:1.9;color:#e4d6e6}.ritual .step{color:var(--gold);font-size:13px;letter-spacing:.15em}.ritual .deckview{height:150px;display:flex;justify-content:center;align-items:center;position:relative;margin:16px auto}.ritual .ritual-card{width:82px;height:128px;border:1px solid #d2ae73;border-radius:7px;background:linear-gradient(140deg,#5a3974,#261634);box-shadow:0 7px 17px #0009;display:grid;place-items:center;color:#e9c78a;font-size:37px;position:absolute;transition:transform .45s ease}.ritual .ritual-card:nth-child(1){transform:translateX(-27px) rotate(-10deg)}.ritual .ritual-card:nth-child(2){transform:translateX(0) rotate(0)}.ritual .ritual-card:nth-child(3){transform:translateX(27px) rotate(10deg)}.ritual .deckview.shuffling .ritual-card:nth-child(1){transform:translateX(70px) rotate(18deg)}.ritual .deckview.shuffling .ritual-card:nth-child(2){transform:translateX(-60px) rotate(-15deg)}.ritual .deckview.shuffling .ritual-card:nth-child(3){transform:translateX(0) rotate(2deg)}.ritual .deckview.cutting .ritual-card:nth-child(1){transform:translate(-55px,-22px) rotate(-7deg)}.ritual .deckview.cutting .ritual-card:nth-child(2){transform:translate(58px,15px) rotate(7deg)}.ritual .deckview.cutting .ritual-card:nth-child(3){transform:translate(0,0)}.ritual .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}.ritual .hint{font-size:13px;color:#c5b0cb;min-height:24px}.ritual .cutoptions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}.ritual .cutoptions button{min-width:100px}.ritual button{min-width:130px}.ritual[hidden],.clock[hidden],.controls[hidden],.notice[hidden],.results[hidden]{display:none!important}
</style></head><body><header><a href="index.html">← 返回拾光塔羅首頁</a><h1>✦ 新年塔羅・命運時鐘 ✦</h1><p class="sub">先靜心、洗牌、切牌，再親手翻開十二個宮位。<br>跟隨自己的節奏，迎接新的一年。</p></header><div class="settings"><label>牌陣 <select id="mode"><option value="house">十二宮位</option><option value="month">十二月份</option></select></label><label>年度 <input id="year" type="number" min="2000" max="2100" value="2027" style="width:95px"></label></div><section class="ritual" id="ritual" aria-live="polite"><div class="step" id="ritualStep">第一步 · 靜心</div><h2 id="ritualTitle">讓心慢慢安靜</h2><p id="ritualText">調整坐姿，緩緩吸氣，再慢慢吐氣。<br>將注意力放在即將到來的新一年。準備好了，再繼續。</p><div class="deckview" id="deckview" aria-hidden="true"><div class="ritual-card">✧</div><div class="ritual-card">✧</div><div class="ritual-card">✧</div></div><div class="cutoptions" id="cutoptions" hidden></div><div class="actions"><button id="ritualMain">我準備好了</button><button id="ritualNext" class="secondary" hidden>完成洗牌，準備切牌</button></div><p class="hint" id="ritualHint"></p></section><div class="clock" id="clock" hidden><div class="center"><div class="year" id="clockyear">2027</div><div class="status" id="status">準備抽取<br>第一張牌</div></div></div><div class="controls" id="controls" hidden><button id="copy" class="secondary" disabled>複製抽牌紀錄</button><button id="reset" class="secondary">重新開始</button></div><p class="notice" id="notice" hidden>直接點擊圓盤上尚未翻開的宮位，每次只抽一張。78 張牌不重複，正逆位隨機決定。<br>完成後複製十二張牌的文字紀錄，傳給占卜師解讀。</p><div id="toast" role="status" aria-live="polite"></div><section class="results" id="resultSection" hidden><h2>抽牌紀錄</h2><div class="results-grid" id="results"></div></section>

];
const houses=['自我','財帛','溝通','家庭','戀愛','日常','伴侶','共享資源','遠行','事業','社群','內在'];
const months=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const clock=document.getElementById('clock'),mode=document.getElementById('mode'),year=document.getElementById('year'),copyBtn=document.getElementById('copy'),resetBtn=document.getElementById('reset'),status=document.getElementById('status'),results=document.getElementById('results'),toast=document.getElementById('toast');
let picks=[],deck=[],ritualPhase=0,shuffleCount=0;
const ritual=document.getElementById('ritual'),ritualStep=document.getElementById('ritualStep'),ritualTitle=document.getElementById('ritualTitle'),ritualText=document.getElementById('ritualText'),deckview=document.getElementById('deckview'),ritualMain=document.getElementById('ritualMain'),ritualNext=document.getElementById('ritualNext'),cutoptions=document.getElementById('cutoptions'),ritualHint=document.getElementById('ritualHint');
function shuffleDeck(){for(let i=deck.length-1;i>0;i--){let j=rnd(i+1);[deck[i],deck[j]]=[deck[j],deck[i]];}}
function showRitual(phase){
 ritualPhase=phase;ritual.hidden=false;clock.hidden=true;document.getElementById('controls').hidden=true;document.getElementById('notice').hidden=true;document.getElementById('resultSection').hidden=true;
 ritualNext.hidden=true;cutoptions.hidden=true;ritualMain.hidden=false;deckview.className='deckview';
 if(phase===0){ritualStep.textContent='第一步 · 靜心';ritualTitle.textContent='讓心慢慢安靜';ritualText.innerHTML='調整坐姿，緩緩吸氣，再慢慢吐氣。<br>將注意力放在即將到來的新一年。準備好了，再繼續。';ritualMain.textContent='我準備好了';ritualHint.textContent='沒有時間限制，依自己的節奏即可。';}
 if(phase===1){ritualStep.textContent='第二步 · 洗牌';ritualTitle.textContent='將心意交給牌組';ritualText.innerHTML='想著這一年的方向，輕觸下方按鈕洗牌。<br>想洗幾次都可以，直到覺得剛剛好。';ritualMain.textContent='✦ 洗牌';ritualNext.hidden=false;ritualHint.textContent='已洗牌 '+shuffleCount+' 次';}
 if(phase===2){ritualStep.textContent='第三步 · 切牌';ritualTitle.textContent='親手切開命運的牌組';ritualText.innerHTML='依直覺選擇切牌位置。<br>完成切牌後，十二宮的命運時鐘就會開啟。';ritualMain.hidden=true;cutoptions.hidden=false;cutoptions.replaceChildren();['左側','中央','右側'].forEach((label,i)=>{let b=document.createElement('button');b.textContent=label;b.className='secondary';b.addEventListener('click',()=>cutDeck([.25,.5,.75][i]));cutoptions.append(b)});ritualHint.textContent='請選擇一個位置';deckview.classList.add('cutting');}
}
function cutDeck(ratio){let at=Math.max(1,Math.min(deck.length-1,Math.round(deck.length*ratio)));deck=[...deck.slice(at),...deck.slice(0,at)];ritual.hidden=true;clock.hidden=false;document.getElementById('controls').hidden=false;document.getElementById('notice').hidden=false;document.getElementById('resultSection').hidden=false;render();}
ritualMain.addEventListener('click',()=>{if(ritualPhase===0){showRitual(1)}else if(ritualPhase===1){shuffleDeck();shuffleCount++;deckview.classList.toggle('shuffling');ritualHint.textContent='已洗牌 '+shuffleCount+' 次';}});
ritualNext.addEventListener('click',()=>showRitual(2));
const labels=()=>mode.value==='house'?houses:months;const rnd=n=>Math.floor(Math.random()*n);
function freshDeck(){deck=tarotDeck.map((c,i)=>({...c,id:i}));for(let i=deck.length-1;i>0;i--){let j=rnd(i+1);[deck[i],deck[j]]=[deck[j],deck[i]];}}
function countPicks(){return picks.filter(Boolean).length;}
function reveal(i){
  if(picks[i] || countPicks()>=12)return;
  const card=deck.pop();
  card.reversed=Math.random()<.5;
  picks[i]=card;
  render();
}
function render(){
  clock.querySelectorAll('.slot').forEach(e=>e.remove());
  document.getElementById('clockyear').textContent=year.value||'新年';
  const l=labels(), count=countPicks();
  l.forEach((label,i)=>{
    const angle=(i*30-90)*Math.PI/180;
    const x=50+40*Math.cos(angle),y=50+40*Math.sin(angle);
    const s=document.createElement('div');
    s.className='slot'+(picks[i]?' revealed':'');
    s.style.left=x+'%';s.style.top=y+'%';
    s.setAttribute('role','button');
    s.tabIndex=picks[i]?-1:0;
    s.setAttribute('aria-label',(i+1)+' '+label+(picks[i]?'，已翻開 '+picks[i].name:'，點擊抽牌'));
    const t=document.createElement('div');t.className='label';t.textContent=(i+1)+' · '+label;s.append(t);
    const f=document.createElement('div');f.className='face';
    if(picks[i]){
      const img=document.createElement('img');img.src=picks[i].file;img.alt=picks[i].name;
      img.style.transform=picks[i].reversed?'rotate(180deg)':'none';f.append(img);
    }else{
      const back=document.createElement('span');back.className='back';back.textContent='✧';f.append(back);
    }
    s.append(f);
    const n=document.createElement('div');n.className='name';
    n.textContent=picks[i]?picks[i].name+(picks[i].reversed?'逆':'正'):'點擊翻牌';s.append(n);
    if(!picks[i]){
      s.addEventListener('click',()=>reveal(i));
      s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal(i)}});
    }
    clock.append(s);
  });
  results.replaceChildren();
  picks.forEach((p,i)=>{
    if(!p)return;
    const d=document.createElement('div');d.className='result';
    const b=document.createElement('b');b.textContent=(i+1)+' · '+l[i];
    const t=document.createElement('span');t.textContent=p.name+'・'+(p.reversed?'逆位':'正位');
    d.append(b,t);results.append(d);
  });
  status.innerHTML=count===12?'十二張牌<br>全部完成':'已抽 '+count+' / 12 張<br>點擊宮位翻牌';
  copyBtn.disabled=count!==12;
  mode.disabled=year.disabled=count>0;
}
function reset(){picks=Array(12).fill(null);freshDeck();shuffleCount=0;render();showRitual(0);toast.textContent='';}
resetBtn.addEventListener('click',()=>{if(countPicks()&&!confirm('確定要清除目前抽到的牌，重新開始嗎？'))return;reset()});
mode.addEventListener('change',reset);year.addEventListener('change',render);
function record(){
  return '拾光塔羅｜'+year.value+' 新年'+(mode.value==='house'?'十二宮位':'十二月份')+'\n'
    +'抽牌日期：'+new Date().toLocaleDateString('zh-TW')+'\n'
    +picks.map((p,i)=>(i+1)+'. '+labels()[i]+'：'+p.name+'・'+(p.reversed?'逆位':'正位')).join('\n');
}
copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(record());toast.textContent='已複製十二張牌面紀錄';}catch(e){let a=document.createElement('textarea');a.value=record();document.body.append(a);a.select();document.execCommand('copy');a.remove();toast.textContent='已複製牌面紀錄';}});
reset();
