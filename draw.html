<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上抽牌</title>
  <style>
	  
  body {
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
              url("images/wallpaper.jpg") no-repeat center center fixed;
  background-size: cover;
  color: orange;
  font-family: sans-serif;
  text-align: center;
  padding: 2em;
}

    body {
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
  url("images/wallpaper.jpg") no-repeat center center fixed;
  background-size: cover;
  color: orange;
  font-family: sans-serif;
  text-align: center;
  padding: 2em;
      background-color: black;
      color: orange;
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
    }
    .tarot-button {
      display: block;
      background: #111;
      color: orange;
      border: 1px solid orange;
      border-radius: 0.5em;
      padding: 1em;
      margin: 1em auto;
      max-width: 300px;
      text-decoration: none;
      transition: background 0.3s, color 0.3s;
    }
    .tarot-button:hover {
      background: orange;
      color: black;
    }
    #result {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5em;
    }
    .card-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #111;
      border: 1px solid rgba(255, 165, 0, 0.3);
      border-radius: 0.5em;
      padding: 0.5em;
    }
    .tarot-card {
      max-height: 300px;
    }
    .word-card {
      max-width: 150px;
    }
    .card-name {
      margin-top: 0.3em;
      font-size: 0.9em;
    }
    .overlay {
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .modal {
      background: #222;
      border: 1px solid orange;
      padding: 2em;
      border-radius: 0.5em;
      color: orange;
      max-width: 300px;
      text-align: center;
    }
    .modal button {
      margin-top: 1em;
    }
  
    /* 晏無咎：獨立解牌入口，不影響既有抽牌功能 */
    .reader-card {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      width: min(100%, 610px);
      box-sizing: border-box;
      margin: 0.6rem auto 2rem;
      padding: 0.85rem;
      border: 1px solid rgba(220, 169, 99, 0.65);
      border-radius: 16px;
      background: linear-gradient(130deg, rgba(39, 22, 54, .96), rgba(16, 12, 25, .96));
      text-decoration: none;
      color: #f6e5ca;
      text-align: left;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .3);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .reader-card:hover, .reader-card:focus-visible {
      transform: translateY(-3px);
      border-color: #e8be82;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .48);
    }
    .reader-card:focus-visible { outline: 2px solid orange; outline-offset: 3px; }
    .reader-portrait {
      width: 145px;
      height: 175px;
      object-fit: cover;
      object-position: 50% 27%;
      flex-shrink: 0;
      border-radius: 10px;
      display: block;
    }
    .reader-content { display: flex; flex-direction: column; gap: .6rem; }
    .reader-eyebrow { font-size: .82rem; color: #d7ad77; letter-spacing: .11em; }
    .reader-name { font-size: 1.45rem; font-weight: 700; color: #fff1d7; }
    .reader-description { font-size: .96rem; color: #ded2df; line-height: 1.6; }
    .reader-cta { font-size: .95rem; font-weight: 700; color: #ffc880; }
    @media (max-width: 460px) {
      body { padding: 1.15em; }
      .reader-card { gap: .85rem; padding: .65rem; }
      .reader-portrait { width: 105px; height: 146px; }
      .reader-name { font-size: 1.2rem; }
      .reader-description { font-size: .86rem; }
      .reader-cta { font-size: .86rem; }
    }
  </style>
</head>

                    <img src=\"${file}\" class=\"word-card\">
                 </div>`;
      }
      document.getElementById("result").innerHTML = html;
    }

    function drawTimeCard() {
